name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Give execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Give execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: ./gradlew clean assemble

  docker:
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Give execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Read base version
        run: |
          BASE_VERSION=$(./gradlew -q printVersion | tail -n 1 | tr -d '\r')
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "Base version: $BASE_VERSION"

      - name: Generate application version
        run: |
          APP_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "App version: $APP_VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/robot-management-service:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/robot-management-service:${{ env.APP_VERSION }} .

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/robot-management-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/robot-management-service:${{ env.APP_VERSION }}

      - name: Show published version
        run: |
          echo "Published version: ${{ env.APP_VERSION }}"