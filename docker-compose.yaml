version: "3.9"

services:

  robot-management-service:
    build: .
    container_name: robot-management-service
    restart: unless-stopped
    depends_on:
      robot-management-service-database:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://robot-management-service-database:27017/robot_management
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: robot-management-service-kafka:29092
      SPRING_ROBOT_CREATED_TOPIC: robot.created
      SPRING_ROBOT_UPDATED_TOPIC: robot.updated
      SPRING_ROBOT_CHANGE_STATUS_TOPIC: robot.change-status
      SPRING_ROBOT_DELETED_TOPIC: robot.deleted
    networks:
      - robomind-network

  robot-management-service-database:
    image: mongo:7
    container_name: robot-management-service-database
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - robot-management-service-database-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - robomind-network

  redis:
    image: redis:7-alpine
    container_name: robot-management-service-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - robomind-network

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: robot-management-service-redis-ui
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    networks:
      - robomind-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: robot-management-service-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - robomind-network

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: robot-management-service-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: robot-management-service-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://robot-management-service-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - robomind-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: robot-management-service-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: robot-management-service-kafka:29092
    networks:
      - robomind-network

  prometheus:
    image: prom/prometheus:latest
    container_name: robot-management-service-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - robomind-network

volumes:
  robot-management-service-database-data:

networks:
  robomind-network: