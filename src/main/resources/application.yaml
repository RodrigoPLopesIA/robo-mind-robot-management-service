server:
  port: 8081

spring:
  application:
    name: robot-management-service

  data:
    mongodb:
      uri: ${MONGODB_URI}

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

    export:
      prometheus:
        enabled: true

topics:
  robot:
    created: ${ROBOT_CREATED_TOPIC}
    updated: ${ROBOT_UPDATED_TOPIC}
    change-status: ${ROBOT_CHANGE_STATUS_TOPIC}
    deleted: ${ROBOT_DELETED_TOPIC}